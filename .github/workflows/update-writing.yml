name: Update profile stats

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_writing.py"
      - ".github/workflows/update-writing.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh profile stats
        env:
          # Personal token with access to the repositories included in the stats.
          GITHUB_TOKEN: ${{ secrets.GH_TOEKN }}
        run: python .github/scripts/update_writing.py

      - name: Commit updated entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/languages.svg assets/overview.svg

          if git diff --staged --quiet; then
            echo "Profile content is already current."
            exit 0
          fi

          git commit -m "content: refresh profile stats"

          git fetch origin
          git rebase origin/main

          git push
