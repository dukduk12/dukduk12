name: Generate 3D contribution garden

on:
  push:
    branches: [main]
    paths:
      - ".github/profile-3d-monochrome.json"
      - ".github/patches/profile-3d-custom.patch"
      - ".github/workflows/profile-3d.yml"
  schedule:
    # 03:12 KST every day
    - cron: "12 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-profile-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out pinned 3D generator
        uses: actions/checkout@v5
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: v0.9.3
          path: .profile-3d-generator
      - name: Build customized 3D generator
        working-directory: .profile-3d-generator
        run: |
          git apply ../.github/patches/profile-3d-custom.patch
          npm ci
          npm run build
      - name: Generate customized 3D contribution garden
        working-directory: .profile-3d-generator
        run: node . "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOEKN }}
          SETTING_JSON: ../.github/profile-3d-monochrome.json
          MAX_REPOS: 100
      - name: Copy generated garden
        run: |
          mkdir -p profile-3d-contrib
          cp .profile-3d-generator/profile-3d-contrib/profile-monochrome.svg profile-3d-contrib/profile-monochrome.svg
      - name: Convert every panel to monochrome
        run: python .github/scripts/grayscale_svg.py profile-3d-contrib/profile-monochrome.svg
      - name: Commit generated garden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --staged --quiet; then
            echo "3D contribution garden is already current."
            exit 0
          fi
          git commit -m "content: refresh 3D contribution garden"
          git fetch origin
          git rebase origin/main
          git push
